name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm prisma generate
      - run: pnpm test
        env:
          AI_PROMPT_SUGGEST_STACK: mock
          AI_PROMPT_INTERVIEW_SYSTEM: mock
          AI_PROMPT_EVALUATE_SYSTEM: mock
          AI_PROMPT_EVALUATE_USER: mock
          AI_PROMPT_START_MESSAGE: Hello
          AI_MODEL: mock
          OPENCODE_API_KEY: mock